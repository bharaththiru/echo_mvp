workflows:
  ios_sideloadly:
    name: iOS Sideloadly (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: 16.4.x
      cocoapods: default
    scripts:
      - name: Flutter packages
        script: |
          flutter --version
          flutter pub get

      - name: Build iOS (no codesign)
        script: |
          export CFLAGS="${CFLAGS//-G/}"
          export CXXFLAGS="${CXXFLAGS//-G/}"
          export LDFLAGS="${LDFLAGS//-G/}"
          export OTHER_CFLAGS="${OTHER_CFLAGS//-G/}"
          export OTHER_CPLUSPLUSFLAGS="${OTHER_CPLUSPLUSFLAGS//-G/}"
          export OTHER_LDFLAGS="${OTHER_LDFLAGS//-G/}"
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          IPA_DIR=build/ios/ipa
          APP_PATH=build/ios/iphoneos/Runner.app
          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP_PATH" "$IPA_DIR/Payload/Runner.app"
          cd "$IPA_DIR"
          ditto -c -k --sequesterRsrc --keepParent Payload Echo.ipa

    artifacts:
      - build/ios/ipa/Echo.ipa
      - build/ios/iphoneos/Runner.app
