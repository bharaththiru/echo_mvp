workflows:
  ios_sideloadly:
    name: iOS Sideloadly (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: 16.4
      cocoapods: 1.15.2
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
    scripts:
      - name: Clean workspace
        script: |
          set -euo pipefail
          flutter clean
          rm -rf ios/Pods ios/.symlinks ios/Flutter/Flutter.podspec ios/Podfile.lock build/ios
      - name: Install dependencies
        script: |
          set -euo pipefail
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..
      - name: Strip -G flags from Xcode settings
        script: |
          set -euo pipefail
          find ios -type f \( -name "*.xcconfig" -o -name "project.pbxproj" \) -print0 | \
            xargs -0 perl -0777 -pi -e 's/(^|\s)-G(?=\s|$)//g; s/(^|\s)-G[^\s"]+//g; s/\s{2,}/ /g; s/\s+$//gm'
          echo "Remaining -G occurrences (should be none):"
          find ios -type f \( -name "*.xcconfig" -o -name "project.pbxproj" \) -print0 | \
            xargs -0 grep -n " -G" || true
      - name: Build iOS (Flutter, no codesign)
        script: |
          set -euo pipefail
          # Generate Xcode project settings only (no archive) so we can override flags cleanly.
          flutter build ios --release --no-codesign --config-only

          # Build with xcodebuild (removed unnecessary OTHER_*FLAGS overrides).
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            build
      - name: Package unsigned IPA
        script: |
          set -euo pipefail

          # Prefer the xcodebuild DerivedData output, fallback to Flutter default.
          APP_PATH=""
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP_PATH=build/ios/iphoneos/Runner.app
          else
            APP_PATH=$(find build/ios/DerivedData/Build/Products -maxdepth 2 -type d -name "Runner.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found. Check build step output paths."
            exit 1
          fi
          IPA_DIR=build/ios/ipa

          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP_PATH" "$IPA_DIR/Payload/Runner.app"

          if [ -d "$APP_PATH/Frameworks" ]; then
            SWIFT_SUPPORT="$IPA_DIR/SwiftSupport/iphoneos"
            mkdir -p "$SWIFT_SUPPORT"
            xcrun --sdk iphoneos swift-stdlib-tool \
              --copy \
              --scan-executable "$APP_PATH/Runner" \
              --scan-folder "$APP_PATH/Frameworks" \
              --platform iphoneos \
              --destination "$SWIFT_SUPPORT" \
              --strip-bitcode
          fi

          cd "$IPA_DIR"
          if [ -d "SwiftSupport" ]; then
            zip -r -y Echo-unsigned.ipa Payload SwiftSupport
          else
            zip -r -y Echo-unsigned.ipa Payload
          fi
    artifacts:
      - build/ios/ipa/Echo-unsigned.ipa
      - build/ios/iphoneos/Runner.app
