workflows:
  ios_sideloadly:
    name: iOS Sideloadly (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: 16.4.x
      cocoapods: default
    scripts:
      - name: Flutter packages
        script: |
          flutter --version
          flutter pub get
      - name: Install pods
        script: |
          cd ios
          pod install
          cd ..

      - name: Strip invalid -G flags
        script: |
          unset CFLAGS CXXFLAGS LDFLAGS OTHER_CFLAGS OTHER_CPLUSPLUSFLAGS OTHER_LDFLAGS
          export CFLAGS=""
          export CXXFLAGS=""
          export LDFLAGS=""
          export OTHER_CFLAGS=""
          export OTHER_CPLUSPLUSFLAGS=""
          export OTHER_LDFLAGS=""
          find ios -name "*.xcconfig" -o -name "project.pbxproj" | while read -r file; do
            perl -pi -e 's/(^|\\s)-G(\\s|$)/ /g; s/\\s{2,}/ /g; s/\\s+$//g' "$file"
          done

      - name: Build iOS (no codesign)
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package unsigned IPA
        script: |
          IPA_DIR=build/ios/ipa
          APP_PATH=build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app
          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP_PATH" "$IPA_DIR/Payload/Runner.app"
          cd "$IPA_DIR"
          ditto -c -k --sequesterRsrc --keepParent Payload Echo.ipa

    artifacts:
      - build/ios/ipa/Echo.ipa
      - build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app
