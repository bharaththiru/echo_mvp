workflows:
  ios_sideloadly:
    name: iOS Sideloadly (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: 16.4
      cocoapods: default
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Clean workspace
        script: |
          flutter clean
          rm -rf ios/Pods ios/.symlinks ios/Flutter/Flutter.podspec ios/Podfile.lock build/ios
      - name: Install dependencies
        script: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..
      - name: Build IPA (Flutter, no codesign)
        script: |
          flutter build ipa --release --no-codesign \
            --build-name=1.0.0 --build-number=1 \
            --dart-define=CI=true
    artifacts:
      - build/ios/ipa/Echo.ipa
      - build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app
