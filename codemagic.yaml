workflows:
  ios_sideloadly:
    name: iOS Sideloadly (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: 16.4.x
      cocoapods: default
    cache:
      cache_paths:
        - ~/.pub-cache
        - ios/.symlinks
    scripts:
      - name: Clean build artifacts
        script: |
          flutter clean
          rm -rf ios/Pods ios/.symlinks ios/Flutter/Flutter.podspec ios/Podfile.lock
      - name: Flutter packages
        script: |
          flutter --version
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..
      - name: Strip -G flags
        script: |
          find ios -type f \( -name "*.xcconfig" -o -name "project.pbxproj" \) -print0 | \
            xargs -0 perl -0777 -pi -e 's/(^|\s)-G[^\s"]+//g; s/\s{2,}/ /g; s/\s+$//gm'
      - name: Build iOS (no codesign)
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            EXPLICIT_MODULE_BUILD=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            SWIFT_PRECOMPILE_MODULES=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build
      - name: Package unsigned IPA
        script: |
          IPA_DIR=build/ios/ipa
          APP_PATH=build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app
          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP_PATH" "$IPA_DIR/Payload/Runner.app"
          cd "$IPA_DIR"
          ditto -c -k --sequesterRsrc --keepParent Payload Echo.ipa
    artifacts:
      - build/ios/ipa/Echo.ipa
      - build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app
