workflows:
  ios_sideloadly:
    name: iOS Sideloadly (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: "16.0"
      cocoapods: 1.16.2
      groups:
        - "Clerk Auth"
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
    scripts:
      - name: Clean workspace
        script: |
          set -euo pipefail
          flutter clean
          rm -rf ios/Pods ios/.symlinks ios/Flutter/Flutter.podspec ios/Podfile.lock build/ios
      - name: Install dependencies
        script: |
          set -euo pipefail
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..
      - name: Strip -G flags from Xcode settings
        script: |
          set -euo pipefail
          # Only strip -G flags from xcconfig files (CocoaPods-generated).
          # Do NOT touch project.pbxproj — the whitespace cleanup destroys it.
          find ios -type f -name "*.xcconfig" -print0 | \
            xargs -0 sed -i '' 's/ -G[^ "]*//g' 2>/dev/null || \
          find ios -type f -name "*.xcconfig" -print0 | \
            xargs -0 sed -i  's/ -G[^ "]*//g'
          echo "Remaining -G occurrences (should be none):"
          find ios -type f -name "*.xcconfig" -print0 | \
            xargs -0 grep -n " -G" || true
      - name: Strip com.apple.provenance xattr
        script: |
          set -euo pipefail
          # Xcode 16 / macOS 15 sets com.apple.provenance on framework bundles which
          # causes codesign to reject them even with CODE_SIGNING_ALLOWED=NO.
          # See: https://github.com/flutter/flutter/issues/180351
          find . -name "*.framework" -exec xattr -r -d com.apple.provenance {} \; 2>/dev/null || true
          find "$HOME/flutter" -name "*.framework" -exec xattr -r -d com.apple.provenance {} \; 2>/dev/null || true
      - name: Force-disable code signing in Xcode project
        script: |
          set -euo pipefail
          # Belt-and-suspenders: ensure every build configuration in the Xcode
          # project has code signing fully disabled so --no-codesign works
          # regardless of Xcode version quirks.
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's|"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer"|"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = ""|g' "$PBXPROJ" 2>/dev/null || \
          sed -i  's|"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer"|"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = ""|g' "$PBXPROJ"

          # Safety net: strip any CODE_SIGN_ENTITLEMENTS that may have been
          # re-added (e.g. by Xcode project migration).  The entitlements file
          # is kept in the repo for Sideloadly to apply at signing time.
          sed -i '' '/CODE_SIGN_ENTITLEMENTS/d' "$PBXPROJ" 2>/dev/null || \
          sed -i  '/CODE_SIGN_ENTITLEMENTS/d' "$PBXPROJ"

          # Ensure CODE_SIGNING_REQUIRED and CODE_SIGNING_ALLOWED are set to NO
          # for all Runner build configurations.  Without these Xcode may still
          # demand a Development Team even with --no-codesign.
          if ! grep -q 'CODE_SIGNING_REQUIRED' "$PBXPROJ"; then
            sed -i '' 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;/g' "$PBXPROJ" 2>/dev/null || \
            sed -i  's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;/g' "$PBXPROJ"
          fi
      - name: Build iOS (Flutter, no codesign)
        script: |
          set -euo pipefail

          # CLERK_PUBLISHABLE_KEY must be set in the "Clerk Auth" variable group on the Codemagic website.
          : "${CLERK_PUBLISHABLE_KEY:?CLERK_PUBLISHABLE_KEY is not set in Codemagic environment variables.}"

          # Try flutter build first; if it fails (common with Xcode 16 code-signing
          # quirks), fall back to xcodebuild directly with command-line overrides
          # (highest precedence — overrides project, target, and xcconfig settings).
          if ! flutter build ios --release --no-codesign \
            --dart-define=CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY" 2>&1; then

            echo "flutter build ios failed — retrying with xcodebuild directly..."

            # flutter build ios already generated Generated.xcconfig and compiled
            # Dart AOT artifacts before xcodebuild failed at the signing stage.
            # Re-run xcodebuild with explicit command-line overrides.
            xcodebuild build \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/ios/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=- \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              COMPILER_INDEX_STORE_ENABLE=NO
          fi
      - name: Package unsigned IPA
        script: |
          set -euo pipefail

          # Search common output locations for Runner.app.
          APP_PATH=""
          for candidate in \
            "build/ios/iphoneos/Runner.app" \
            "build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app" \
            ; do
            if [ -d "$candidate" ]; then
              APP_PATH="$candidate"
              break
            fi
          done
          # Broad fallback: search the entire DerivedData tree.
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/ios/DerivedData -maxdepth 4 -type d -name "Runner.app" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found. Check build step output paths."
            exit 1
          fi

          # Normalize output path so Codemagic artifact collection is stable.
          NORMALIZED_APP_PATH=build/ios/iphoneos/Runner.app
          if [ "$APP_PATH" != "$NORMALIZED_APP_PATH" ]; then
            rm -rf "$NORMALIZED_APP_PATH"
            mkdir -p "$(dirname "$NORMALIZED_APP_PATH")"
            ditto "$APP_PATH" "$NORMALIZED_APP_PATH"
            APP_PATH="$NORMALIZED_APP_PATH"
          fi

          IPA_DIR=build/ios/ipa

          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP_PATH" "$IPA_DIR/Payload/Runner.app"

          if [ -d "$APP_PATH/Frameworks" ]; then
            SWIFT_SUPPORT="$IPA_DIR/SwiftSupport/iphoneos"
            mkdir -p "$SWIFT_SUPPORT"
            xcrun --sdk iphoneos swift-stdlib-tool \
              --copy \
              --scan-executable "$APP_PATH/Runner" \
              --scan-folder "$APP_PATH/Frameworks" \
              --platform iphoneos \
              --destination "$SWIFT_SUPPORT" \
              --strip-bitcode
          fi

          cd "$IPA_DIR"
          if [ -d "SwiftSupport" ]; then
            zip -r -y Echo-unsigned.ipa Payload SwiftSupport
          else
            zip -r -y Echo-unsigned.ipa Payload
          fi
    artifacts:
      - build/ios/ipa/Echo-unsigned.ipa
      - build/ios/iphoneos/Runner.app
